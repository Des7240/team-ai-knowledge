<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team AI Knowledge Base - Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .tree-node { transition: all 0.2s; }
    .tree-node:hover { background-color: #1e293b; }
    .icon-folder { color: #3b82f6; }
    .icon-file { color: #94a3b8; }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-network-wired text-blue-400 text-2xl"></i>
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-teal-400">
          Knowledge Base Explorer
        </h1>
      </div>
      <div class="text-slate-400 text-sm">
        <span v-if="loading"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...</span>
        <span v-else><i class="fa-solid fa-check text-green-400 mr-2"></i>Synced</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
      <!-- Sidebar (File Tree) -->
      <aside class="w-1/3 max-w-md bg-slate-900 border-r border-slate-700 overflow-y-auto p-4 custom-scrollbar">
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4">Repository Structure</h2>
        <div v-if="!loading" class="text-sm">
          <tree-item class="item" :model="treeData"></tree-item>
        </div>
      </aside>

      <!-- Content Area -->
      <section class="flex-1 bg-slate-800 p-8 flex items-center justify-center relative overflow-y-auto">
        <div class="text-center text-slate-500 max-w-2xl">
          <i class="fa-regular fa-folder-open text-6xl mb-4 opacity-50"></i>
          <h2 class="text-2xl font-light mb-2">Select a node to explore</h2>
          <p class="text-sm">This map automatically synchronizes with your MCP server's knowledge base.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Recursive Vue Component for Tree -->
  <script type="text/x-template" id="item-template">
    <div>
      <div 
        class="tree-node flex items-center cursor-pointer py-1.5 px-2 rounded group"
        @click="toggle"
      >
        <div class="w-4 flex justify-center mr-1">
          <i v-if="isFolder" class="fa-solid fa-chevron-right text-xs text-slate-500 transition-transform duration-200" :class="{ 'rotate-90': isOpen }"></i>
        </div>
        <i v-if="isFolder" class="icon-folder fa-solid mr-2" :class="isOpen ? 'fa-folder-open' : 'fa-folder'"></i>
        <i v-else class="icon-file fa-brands fa-markdown mr-2"></i>
        <span class="truncate flex-1 font-medium group-hover:text-blue-300 transition-colors" :class="isFolder ? 'text-slate-200' : 'text-slate-400'">
          {{ name }}
        </span>
      </div>
      
      <div v-show="isOpen" v-if="isFolder" class="pl-6 border-l border-slate-700 ml-4 my-1">
        <tree-item
          class="item"
          v-for="(child, key) in model"
          :key="key"
          :model="child"
          :name="key"
        ></tree-item>
      </div>
    </div>
  </script>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const TreeItem = {
      name: 'TreeItem',
      template: '#item-template',
      props: {
        model: [Object, String],
        name: {
          type: String,
          default: 'Knowledge Base Root'
        }
      },
      setup(props) {
        const isOpen = ref(props.name === 'Knowledge Base Root' || props.name === 'projects');
        
        const isFolder = computed(() => {
          return typeof props.model === 'object' && props.model !== null;
        });

        function toggle() {
          if (isFolder.value) {
            isOpen.value = !isOpen.value;
          }
        }

        return {
          isOpen,
          isFolder,
          toggle
        }
      }
    };

    createApp({
      components: {
        TreeItem
      },
      setup() {
        const treeData = ref({});
        const loading = ref(true);

        onMounted(async () => {
          try {
            const res = await fetch('/api/map');
            const data = await res.json();
            if (data.status === 'ok') {
              treeData.value = data.tree;
            }
          } catch (err) {
            console.error('Failed to load map data:', err);
          } finally {
            loading.value = false;
          }
        });

        return {
          treeData,
          loading
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
